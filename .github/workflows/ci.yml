name: "Siftweave"
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install .
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
